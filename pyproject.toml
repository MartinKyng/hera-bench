[project]
name = "Hera-bench"
description = "CLI to manage Multi-tenant deployments for HeraOS apps"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.10"
authors = [
    { name = "Royal Technologies ", email = "kyngmartinugo@gmail.com" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Natural Language :: English",
    "Operating System :: MacOS",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: User Interfaces",
    "Topic :: System :: Installation/Setup",
]
dependencies = [
    "Click>=8.2,<9",
    "GitPython>=3.1.30,<4",
    "honcho>=1.1.0,<3",
    "Jinja2>=3.1.3,<4",
    "python-crontab>=2.6,<4",
    "requests>=2.32.5,<3",
    "semantic-version>=2.10,<3",
    "setuptools>=71.0.0",
    "tomli>=2.0.1;python_version<'3.11'",
    "uv>=0.9.0"
]
dynamic = [
    "version",
]

[project.scripts]
bench = "bench.cli:cli"

[project.urls]
Changelog = "https://github.com/MartinKyng/hera-bench/releases"
Documentation = "https://github.com/MartinKyng/hera-bench/tree/develop/docs"
Homepage = "https://github.com/MartinKyng/hera-bench"
Source = "https://github.com/MartinKyng/hera-bench"

[build-system]
requires = [
    "hatchling>=1.27,<2",
]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "bench/__init__.py"

[tool.hatch.build.targets.sdist]
include = [
  "/bench"
]

[tool.hatch.build.targets.wheel]
include = [
  "/bench"
]
