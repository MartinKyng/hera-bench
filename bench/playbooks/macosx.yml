---
- hosts: localhost
  become: yes
  become_user: root

  vars:
    bench_repo_path: "/Users/{{ ansible_user_id }}/.bench"
    bench_path: "/Users/{{ ansible_user_id }}/hera-bench"

  tasks:
    - name: install prequisites
      homebrew:
        name:
          - cmake
          - redis
          - postgresql@16
          - nodejs
        state: present

    - name: install wkhtmltopdf
      homebrew_cask:
        name:
          - wkhtmltopdf
        state: present

    - name: configure PostgreSQL
      include_tasks: roles/postgresql/tasks/main.yml

    - name: Install PostgreSQL driver in global env
      pip: name=psycopg[binary]

    # setup hera-bench
    - include_tasks: includes/setup_bench.yml

    # setup development environment
    - include_tasks: includes/setup_dev_env.yml
      when: not production

...